# Bluvu license server (docs/LICENSING_PLAN.md, phase 3).
# Local:  npm ci && npm run db:local && npm run dev   (uses .dev.vars, never committed)
# Deploy: needs the Cloudflare account, a D1 database id below, and the secrets (see README.md).
name = "bluvu-license"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
SITE_URL = "https://bluvu.example"
# Admin access in production comes from Cloudflare Access (the Cf-Access-Authenticated-User-Email
# header); these addresses may use the admin view. Comma separated.
ADMIN_EMAILS = ""
MOVES_PER_YEAR = "3"
TRIAL_DAYS = "14"
GRACE_DAYS = "30"
SERVER_URL = "https://license.bluvu.example"   # this server's public address (links in emails)
# Payments (Paddle Billing). "sandbox" until the owner says go live; then "production" and the live
# API URL (https://api.paddle.com). Secrets, never here: PADDLE_WEBHOOK_SECRET, PADDLE_API_KEY, LINK_SECRET.
PADDLE_ENV = "sandbox"
PADDLE_API_URL = "https://sandbox-api.paddle.com"
PADDLE_CLIENT_TOKEN = ""   # client-side token (public by design), from Paddle → Developer tools
PADDLE_PRICES = "{}"       # {"starter": "pri_...", "venue": "pri_..."} from the Paddle catalog
EMAIL_FROM = "licenses@bluvu.example"

# Emails (license keys, billing links) through Cloudflare Email Service, once the domain is onboarded:
# [[send_email]]
# name = "EMAIL"
# Without it, emails are only recorded (the admin view shows them).

[[d1_databases]]
binding = "DB"
database_name = "bluvu-license"
database_id = "00000000-0000-0000-0000-000000000000"  # set when the D1 database is created
migrations_dir = "migrations"
